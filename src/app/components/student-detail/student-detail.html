<div class="container">
  <div class="card">
    <h2>{{ isNew ? 'Add Student' : 'Edit Student' }}</h2>

    <div class="avatar-wrapper" *ngIf="!isNew && student.picture">
      <img class="avatar" [src]="student.picture" alt="avatar">
    </div>

    <div class="form-group">
      <label>Name</label>
      <input [(ngModel)]="student.name" placeholder="Full name">
    </div>

    <div class="form-group">
      <label>Age</label>
      <input [(ngModel)]="student.age" type="number" placeholder="Age">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="student.email" placeholder="email@example.com">
    </div>

    <div class="form-group">
      <label>Picture URL</label>
      <input [(ngModel)]="student.picture" placeholder="https://...">
    </div>

    <div class="actions">
      <button class="btn-save" (click)="save()">Save</button>
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>
